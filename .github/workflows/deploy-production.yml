name: Deploy DMS Production

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy DMS to production server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e

            echo "======================================"
            echo "Starting DMS Production Deployment"
            echo "======================================"

            cd "${{ secrets.DEPLOY_PATH }}"

            echo "Current directory:"
            pwd

            echo "Backing up production .env..."
            cp .env /tmp/dms-production.env.backup

            echo "Fetching production branch..."
            git fetch origin production

            echo "Switching to production branch..."
            git checkout -B production origin/production

            echo "Updating code..."
            git reset --hard origin/production

            echo "Restoring production .env..."
            cp /tmp/dms-production.env.backup .env

            echo "Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader

            echo "Clearing Laravel cache..."
            php artisan optimize:clear

            echo "Rebuilding Laravel cache..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Cleaning temporary backup..."
            rm -f /tmp/dms-production.env.backup

            echo "======================================"
            echo "DMS Production Deployment Completed"
            echo "======================================"
